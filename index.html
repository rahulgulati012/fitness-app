    <!-- PWA Manifest & Mobile Standalone Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090A0F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        function purgeInjectedWatermarks(root) {
          var scope = root && root.querySelectorAll ? root : document;
          var selectors = 'iframe[src*="netlify" i], [class*="netlify" i], [id*="netlify" i], [data-netlify], a[href*="netlify.com"]';
          scope.querySelectorAll(selectors).forEach(function (el) {
            if (el.id !== 'root') el.remove();
          });
          var candidates = scope.querySelectorAll('div, aside, footer, section, a, span');
          candidates.forEach(function (el) {
            if (!el || el.id === 'root' || (el.closest && el.closest('#root') && el.children.length > 3)) return;
            var txt = (el.textContent || '').trim();
            if (/powered\s+by\s+netlify/i.test(txt) && txt.length < 120) {
              var hostBanner = el.closest('[style*="fixed"], [style*="sticky"], footer, aside') || el;
              if (hostBanner && hostBanner.id !== 'root') {
                hostBanner.style.setProperty('display', 'none', 'important');
                hostBanner.remove();
              }
            }
          });
        }
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                if (added[j] && added[j].nodeType === 1) {
                  purgeInjectedWatermarks(added[j].parentElement || document);
                }
              }
            }
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', function () { purgeInjectedWatermarks(document); });
        window.addEventListener('load', function () { purgeInjectedWatermarks(document); });
      })();
    </script>
  </head>
  <body class="bg-[#050508] text-white antialiased selection:bg-rose-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
