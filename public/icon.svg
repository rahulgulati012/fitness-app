<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gf-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0F17" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="gf-neon" x1="64" y1="256" x2="448" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="50%" stop-color="#FF5454" />
      <stop offset="100%" stop-color="#FF8C42" />
    </linearGradient>
    <linearGradient id="gf-plate" x1="0" y1="120" x2="0" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222533" />
      <stop offset="50%" stop-color="#11131B" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="gf-rim" x1="0" y1="112" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0.85" />
    </linearGradient>
    <radialGradient id="gf-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#FF8C42" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </radialGradient>
    <filter id="gf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Tile Base -->
  <rect width="512" height="512" rx="112" fill="url(#gf-bg)" />
  <rect x="10" y="10" width="492" height="492" rx="104" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />

  <!-- Crimson/Ember Radial Glow -->
  <circle cx="256" cy="256" r="196" fill="url(#gf-aura)" />

  <!-- Glowing Neon Barbell Shaft -->
  <g filter="url(#gf-glow)">
    <rect x="44" y="242" width="424" height="28" rx="14" fill="url(#gf-neon)" />
  </g>
  <!-- Machined Center Bar Highlight & Knurling Marks -->
  <rect x="184" y="245" width="144" height="22" rx="4" fill="#181A24" stroke="url(#gf-neon)" stroke-width="3" />
  <line x1="214" y1="246" x2="214" y2="266" stroke="#FF2E63" stroke-opacity="0.7" stroke-width="3" />
  <line x1="234" y1="246" x2="234" y2="266" stroke="#FF5454" stroke-opacity="0.7" stroke-width="3" />
  <line x1="256" y1="244" x2="256" y2="268" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" />
  <line x1="278" y1="246" x2="278" y2="266" stroke="#FF7048" stroke-opacity="0.7" stroke-width="3" />
  <line x1="298" y1="246" x2="298" y2="266" stroke="#FF8C42" stroke-opacity="0.7" stroke-width="3" />

  <!-- Left Outer Matte-Black Plate -->
  <rect x="66" y="160" width="40" height="192" rx="14" fill="url(#gf-plate)" stroke="#2E3245" stroke-width="4" />
  <rect x="74" y="182" width="6" height="148" rx="3" fill="#FF2E63" fill-opacity="0.65" />

  <!-- Left Inner Heavy Matte-Black Plate -->
  <rect x="114" y="116" width="54" height="280" rx="18" fill="url(#gf-plate)" stroke="url(#gf-rim)" stroke-width="5" />
  <rect x="128" y="142" width="8" height="228" rx="4" fill="#FF2E63" fill-opacity="0.85" />
  <!-- Left Collar -->
  <rect x="172" y="220" width="20" height="72" rx="6" fill="#232635" stroke="#FF2E63" stroke-width="2.5" />

  <!-- Right Inner Heavy Matte-Black Plate -->
  <rect x="344" y="116" width="54" height="280" rx="18" fill="url(#gf-plate)" stroke="url(#gf-rim)" stroke-width="5" />
  <rect x="376" y="142" width="8" height="228" rx="4" fill="#FF8C42" fill-opacity="0.85" />
  <!-- Right Collar -->
  <rect x="320" y="220" width="20" height="72" rx="6" fill="#232635" stroke="#FF8C42" stroke-width="2.5" />

  <!-- Right Outer Matte-Black Plate -->
  <rect x="406" y="160" width="40" height="192" rx="14" fill="url(#gf-plate)" stroke="#2E3245" stroke-width="4" />
  <rect x="432" y="182" width="6" height="148" rx="3" fill="#FF8C42" fill-opacity="0.65" />
</svg>
